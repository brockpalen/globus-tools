# Local hooks, matching the style used in archivetar and ltfsee-globus.
# Those projects run the tools through `pipenv run`; this one keeps its
# dev tools in .venv (made by `uv sync`), so the entries point there.
repos:
  - repo: local
    hooks:
      # the uv equivalent of pipenv refusing a stale Pipfile.lock
      - id: uv-lock
        name: uv.lock matches pyproject.toml
        stages: [pre-commit]
        language: system
        entry: .venv/bin/uv lock --check
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: isort
        name: isort
        stages: [pre-commit]
        language: system
        entry: .venv/bin/isort
        types: [python]

      - id: black
        name: black
        stages: [pre-commit]
        language: system
        entry: .venv/bin/black
        types: [python]

      - id: flake8
        name: flake8
        stages: [pre-commit]
        language: system
        entry: .venv/bin/flake8
        types: [python]

      # Security linting. Kept enabled because this tool handles refresh
      # tokens; drop `stages` to run it only on demand.
      - id: bandit
        name: bandit
        stages: [pre-commit]
        language: system
        entry: .venv/bin/bandit --ini .bandit
        types: [python]

      - id: pytest
        name: pytest
        stages: [pre-commit]
        language: system
        entry: .venv/bin/pytest --no-cov
        types: [python]
        pass_filenames: false
