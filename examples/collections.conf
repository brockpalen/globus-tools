# Site-wide collection shortcuts for globus-activity.
#
# Install as /etc/globus-activity/collections.conf, or point at it from an
# Lmod module file:
#
#     setenv("GLOBUS_ACTIVITY_COLLECTIONS", "/sw/arcts/globus/collections.conf")
#
# Users then write  dataden:/path  instead of a UUID, and never have to look
# one up. Their own Globus bookmarks still work and take precedence.
#
# Format: NAME = COLLECTION_UUID[:/optional/base/path]
# Names go on a command line, so no spaces and no colons in them.
# `#` starts a comment. `NAME: UUID` and bare `NAME UUID` also work.

# ARC storage services
# https://documentation.its.umich.edu/node/5023
dataden = ab65757f-00f5-4e5b-aa21-133187732a01

# Fill in the rest from the documentation page above; these are placeholders.
#turbo      = 00000000-0000-0000-0000-000000000000
#locker     = 00000000-0000-0000-0000-000000000000
#greatlakes = 00000000-0000-0000-0000-000000000000

# A shortcut may point at a subdirectory rather than the collection root.
# Paths typed after the name are then resolved beneath it, so
# `scratch:mylab` becomes /scratch/mylab.
#scratch = 00000000-0000-0000-0000-000000000000:/scratch
