[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "globus-console-cli"
description = "globus-console (admin Activity view) and globus-fs (ls/find/du) for Globus"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["globus-sdk>=4,<5"]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "flake8",
    "flake8-bugbear",
    "bandit",
    "pytest",
    "pytest-cov",
    "pre-commit",
]

[project.scripts]
globus-console = "globus_console_cli.console:main"
globus-fs = "globus_console_cli.fs:main"

[tool.setuptools.dynamic]
version = { attr = "globus_console_cli.__version__" }

[tool.black]
target-version = ["py39"]
