[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "globus-tools"
description = "globus-fs (ls, find, du, archivescan) and globus-console (Activity view): command line tools for Globus"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["globus-sdk>=4,<5", "humanfriendly>=10"]
dynamic = ["version"]

# Development tools, installed by `uv sync` and never into the standalone
# build. (A PEP 735 dependency group: pip 25.1+ reads it with --group dev.)
[dependency-groups]
dev = [
    "black",
    "isort",
    "flake8",
    "flake8-bugbear",
    "bandit",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "uv>=0.12.21",
]

[project.scripts]
globus-console = "globus_tools.console:main"
globus-fs = "globus_tools.fs:main"

[tool.setuptools.dynamic]
version = { attr = "globus_tools.__version__" }

[tool.black]
target-version = ["py39"]
